spring.application.name=tramites-adulto-mayor
server.port=8080

spring.datasource.url=${SUPABASE_DB_URL}
spring.datasource.username=${SUPABASE_DB_USER}
spring.datasource.password=${SUPABASE_DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=none

gemini.api.key=${GEMINI_API_KEY}

b2.endpoint=${B2_S3_ENDPOINT}
b2.region=${B2_S3_REGION}
b2.bucket=${B2_BUCKET_NAME}
b2.access-key=${B2_ACCESS_KEY_ID}
b2.secret-key=${B2_SECRET_ACCESS_KEY}